<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Weibo Backup — 个人微博备份工具</title>
<style>
/* ============================================================
   Design V2 × E-Ink Paper — matching globals.css exactly
   ============================================================ */
:root {
  --canvas: #f5f3ee;
  --card: #fcfbf8;
  --border: #e6e1d8;
  --hairl: #f0ede6;
  --wash: #f8f6f2;
  --gold: #c2884a;
  --gold-dk: #9a6428;
  --gold-lt: #e0c898;
  --gold-wash: #f9f1e2;
  --gold-glow: rgba(194,136,74,0.12);
  --ink: #1e1810;
  --ink-soft: #4a4035;
  --muted: #7a7065;
  --faint: #b0a89c;
  --sage: #6b8b6e;
  --terracotta: #c0765c;
  --slate: #6b7f8e;
  --blue: #6e8aa0;
  --amber: #b8863e;
  --green: #5a8a5e;
  --red: #c06658;
  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --sh-card: 0 1px 3px rgba(30,24,16,0.035), 0 0 0 1px rgba(30,24,16,0.02);
  --sh-raised: 0 2px 8px rgba(30,24,16,0.05), 0 0 0 1px rgba(30,24,16,0.03);
  --sh-over: 0 6px 20px rgba(30,24,16,0.08), 0 0 0 1px rgba(30,24,16,0.04);
  --font-sans: -apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
  --font-body: -apple-system,BlinkMacSystemFont,'PingFang SC','HarmonyOS Sans SC','MiSans','Microsoft YaHei',system-ui,sans-serif;
  --font-serif: Georgia,'Songti SC','SimSun',serif;
  --content-max: 680px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{
  font-family:var(--font-body);background:var(--canvas);color:var(--ink);
  line-height:1.7;min-height:100vh;position:relative;overflow-x:hidden;
}
/* Paper texture */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.028;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
/* Ambient light */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 15% 5%, rgba(107,127,142,0.04) 0%, transparent 60%), radial-gradient(ellipse 50% 40% at 85% 90%, rgba(194,136,74,0.055) 0%, transparent 60%);
}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:var(--r-xs)}
::selection{background:var(--gold-wash);color:var(--ink)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}

.page-container{position:relative;z-index:1;max-width:var(--content-max);margin:0 auto;padding:0 24px 80px}
@media(max-width:640px){.page-container{padding:0 16px 96px}}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{
  background:linear-gradient(90deg,var(--hairl)25%,var(--border)50%,var(--hairl)75%);
  background-size:200% 100%;animation:shimmer 1.6s ease-in-out infinite;border-radius:var(--r-xs);
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Nav — exact replica */
.app-nav{
  position:sticky;top:0;z-index:20;padding:14px 0;
  background:color-mix(in srgb,var(--canvas)92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  margin-bottom:0;
}
.app-nav-inner{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.nav-brand{
  display:flex;align-items:center;gap:10px;font-family:var(--font-sans);
  font-weight:600;font-size:1.1rem;color:var(--ink);text-decoration:none;
  letter-spacing:-0.01em;cursor:default;
}
.nav-pills{
  display:flex;gap:2px;background:var(--hairl);border-radius:var(--r-sm);padding:3px;
}
.nav-pill{
  display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--r-xs);
  font-size:0.875rem;font-weight:500;color:var(--muted);background:transparent;
  border:none;cursor:pointer;text-decoration:none;
  transition:color 150ms,background 150ms,box-shadow 150ms;white-space:nowrap;
  font-family:var(--font-body);
}
.nav-pill:hover{color:var(--ink-soft)}
.nav-pill.active{color:var(--ink);background:var(--card);box-shadow:var(--sh-card)}
.nav-pill svg{width:16px;height:16px;flex-shrink:0}

/* Page switching */
.page{display:none}
.page.active{display:block}

/* Filter card */
.filter-card{background:var(--card);border-radius:var(--r-lg);padding:18px 22px;box-shadow:var(--sh-card);margin-bottom:14px}
.filter-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.filter-row:last-child{margin-bottom:0}

/* Custom Select */
.cusel-wrap{position:relative;min-width:130px}
.cusel-btn{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  font-family:var(--font-body);font-size:0.875rem;padding:8px 10px;
  border:1px solid var(--border);border-radius:var(--r-xs);background:var(--canvas);
  color:var(--ink);cursor:pointer;outline:none;white-space:nowrap;
}
.cusel-btn:hover{border-color:var(--gold)}
.cusel-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cusel-dropdown{
  position:absolute;top:100%;left:0;margin-top:4px;background:var(--card);
  border-radius:var(--r-sm);box-shadow:var(--sh-over);border:1px solid var(--border);
  min-width:100%;z-index:30;max-height:240px;overflow:auto;
}
.cusel-opt{
  display:block;width:100%;text-align:left;padding:8px 12px;border:none;
  background:transparent;font-family:var(--font-body);font-size:0.84rem;
  color:var(--ink-soft);cursor:pointer;white-space:nowrap;
}
.cusel-opt:hover{background:var(--hairl)}
.cusel-opt.sel{background:var(--hairl);color:var(--ink)}

/* Segmented control */
.seg-ctrl{display:flex;gap:1px;background:var(--hairl);border-radius:var(--r-xs);padding:2px}
.seg-btn{
  display:flex;align-items:center;gap:5px;padding:6px 14px;
  border-radius:calc(var(--r-xs) - 1px);border:none;
  background:transparent;color:var(--muted);
  font-size:0.84rem;font-family:var(--font-body);cursor:pointer;
  transition:color 150ms,background 150ms,box-shadow 150ms;white-space:nowrap;
}
.seg-btn:hover{color:var(--ink-soft)}
.seg-btn.active{background:var(--card);color:var(--ink);box-shadow:var(--sh-card)}
.seg-btn svg{width:14px;height:14px;flex-shrink:0}

/* Search input */
.search-wrap{position:relative;flex:1;min-width:160px;max-width:260px;margin-left:auto}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-input{
  font-family:var(--font-body);font-size:0.875rem;padding:8px 12px 8px 32px;width:100%;
  border:1px solid var(--border);border-radius:var(--r-xs);background:var(--canvas);
  color:var(--ink);outline:none;
}
.search-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}

/* DatePicker */
.dp-wrap{position:relative}
.dp-trigger{
  display:flex;align-items:center;gap:6px;font-family:var(--font-body);font-size:0.875rem;
  padding:8px 10px;min-width:130px;border:1px solid var(--border);border-radius:var(--r-xs);
  background:var(--canvas);color:var(--ink);cursor:pointer;outline:none;white-space:nowrap;
}
.dp-trigger:hover{border-color:var(--gold)}
.dp-drop{
  position:absolute;top:100%;left:0;margin-top:4px;z-index:40;
  background:var(--card);border-radius:var(--r-md);padding:14px;width:260px;
  box-shadow:var(--sh-over);border:1px solid var(--border);
}
.dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dp-nav button{width:28px;height:28px;border:none;background:none;color:var(--ink-soft);cursor:pointer;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;font-size:1rem}
.dp-nav button:hover{background:var(--hairl)}
.dp-nav select{font-family:var(--font-body);font-size:0.84rem;font-weight:600;color:var(--ink);border:none;background:transparent;cursor:pointer;outline:none}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-day-hd{text-align:center;font-size:0.68rem;font-weight:500;color:var(--muted);padding:4px 0}
.dp-day{
  width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border:none;border-radius:var(--r-xs);background:transparent;
  color:var(--ink-soft);font-family:var(--font-body);font-size:0.8rem;cursor:pointer;
}
.dp-day:hover{background:var(--hairl)}
.dp-day.today{color:var(--gold-dk);font-weight:600}
.dp-day.sel{background:var(--gold);color:#fff;font-weight:600}
.dp-day.empty{cursor:default}
.dp-actions{display:flex;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--hairl)}
.dp-actions button{
  flex:1;padding:6px 0;font-family:var(--font-body);font-size:0.78rem;font-weight:500;
  cursor:pointer;border-radius:var(--r-xs);
}
.dp-btn-clear{border:1px solid var(--border);background:transparent;color:var(--muted)}
.dp-btn-clear:hover{background:var(--hairl)}
.dp-btn-today{border:none;background:var(--gold-wash);color:var(--gold-dk)}
.dp-btn-today:hover{background:var(--gold-lt)}

/* Stats bar */
.stats-bar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;
  gap:10px;font-size:0.84rem;color:var(--muted);padding:0 4px;margin-bottom:22px;
}
.stats-bar strong{color:var(--ink-soft)}

/* Export button */
.export-wrap{position:relative}
.export-btn{
  display:flex;align-items:center;gap:4px;font-family:var(--font-body);font-size:0.84rem;
  font-weight:500;padding:6px 14px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--card);color:var(--ink-soft);cursor:pointer;
}
.export-btn:hover{border-color:var(--gold)}
.export-menu{
  position:absolute;top:100%;right:0;margin-top:4px;background:var(--card);
  border-radius:var(--r-sm);box-shadow:var(--sh-over);border:1px solid var(--border);
  min-width:170px;z-index:30;overflow:hidden;
}
.export-item{
  display:block;width:100%;text-align:left;padding:9px 14px;border:none;
  background:transparent;font-family:var(--font-body);font-size:0.84rem;
  color:var(--ink-soft);cursor:pointer;
}
.export-item:hover{background:var(--hairl)}

/* Post Card */
.post-card{
  background:var(--card);border-radius:var(--r-md);padding:20px 24px;
  box-shadow:var(--sh-card);margin-bottom:12px;cursor:pointer;
  transition:box-shadow 250ms var(--ease-out);
}
.post-card:hover{box-shadow:var(--sh-raised)}
.post-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.post-avatar{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:0.8rem;font-weight:600;font-family:var(--font-sans);
}
.post-meta{flex:1;min-width:0}
.post-name{font-size:0.875rem;font-weight:600;color:var(--ink);line-height:1.35}
.post-time{font-size:0.78rem;color:var(--muted);line-height:1.35}
.post-badges{display:flex;gap:6px}
.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:0.72rem;
  padding:3px 9px;border-radius:99px;font-weight:500;white-space:nowrap;
}
.badge svg{width:11px;height:11px;flex-shrink:0}
.badge-original{background:var(--gold-wash);color:var(--gold-dk)}
.badge-repost{background:#edf0f4;color:var(--slate)}
.badge-long{background:#f5f0e9;color:var(--amber)}
.post-content{
  font-size:0.95rem;line-height:1.78;color:var(--ink-soft);
  margin-bottom:14px;white-space:pre-wrap;word-break:break-word;
}
.post-repost-embed{
  background:var(--hairl);border-radius:var(--r-sm);padding:14px 18px;
  margin-bottom:12px;border-left:3px solid var(--border);cursor:pointer;
}
.post-repost-embed .rlabel{
  font-size:0.84rem;color:var(--muted);margin-bottom:6px;
  display:flex;align-items:center;gap:6px;
}
.post-repost-embed .rlabel strong{color:var(--ink-soft);font-weight:600}
.post-repost-embed .rtext{
  font-size:0.88rem;color:var(--muted);line-height:1.65;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.post-repost-embed .rtext.expanded{display:block;-webkit-line-clamp:unset}
.post-repost-embed .rtoggle{
  font-size:0.78rem;color:var(--gold);margin-top:6px;font-weight:500;
  display:flex;align-items:center;gap:4px;
}
.post-footer{
  display:flex;align-items:center;gap:14px;font-size:0.8rem;color:var(--muted);
  padding-top:10px;border-top:1px solid var(--hairl);
}
.post-footer svg{width:14px;height:14px;flex-shrink:0}
.post-source{display:flex;align-items:center;gap:4px;margin-right:auto}
.post-stat{display:flex;align-items:center;gap:3px}

/* Year divider */
.year-div{
  display:flex;align-items:center;gap:16px;padding:14px 0 4px;
}
.year-div span{
  font-family:var(--font-sans);font-size:0.78rem;font-weight:600;
  color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;
}
.year-div::after{content:'';flex:1;height:1px;background:var(--border)}

/* Pagination */
.pager{
  display:flex;justify-content:flex-end;align-items:center;gap:6px;
  padding:12px 0;flex-wrap:wrap;
}
.pager-btn{
  display:flex;align-items:center;justify-content:center;min-width:36px;height:36px;
  padding:0 10px;border-radius:var(--r-xs);border:1px solid var(--border);
  background:var(--card);font-family:var(--font-body);font-size:0.875rem;cursor:pointer;
  color:var(--ink-soft);
}
.pager-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-dk)}
.pager-btn.active{background:var(--gold-wash);border-color:var(--gold);color:var(--gold-dk);font-weight:600}
.pager-btn:disabled{opacity:0.4;cursor:default}
.pager-dots{color:var(--muted);padding:0 2px;font-size:0.8rem}
.pager-jump{display:flex;align-items:center;gap:4px;margin-left:8px}
.pager-jump input{
  width:52px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--r-xs);
  background:var(--card);color:var(--ink);font-family:var(--font-body);font-size:0.8rem;
  text-align:center;outline:none;
}
.pager-jump input:focus{border-color:var(--gold)}

/* Shuffle — dual column */
.shuffle-status{display:flex;align-items:center;justify-content:space-between;font-size:0.82rem;color:var(--muted);padding:0 4px;margin-bottom:14px}
.shuffle-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shuffle-col{display:flex;flex-direction:column;gap:10px}
.shuffle-card{
  border-radius:var(--r-sm);overflow:hidden;cursor:pointer;
  transition:box-shadow 250ms var(--ease-out);
}
.shuffle-card:hover{box-shadow:var(--sh-over)}
.shuffle-card .sc-body{padding:14px 16px}
.shuffle-card .sc-name{
  font-size:0.72rem;color:var(--muted);margin-bottom:4px;
  display:flex;align-items:center;gap:4px;
}
.shuffle-card .sc-avatar{
  width:16px;height:16px;border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;color:#fff;font-size:0.6rem;
  font-weight:600;font-family:var(--font-sans);flex-shrink:0;
}
.shuffle-card .sc-content{
  font-size:0.9rem;line-height:1.65;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word;margin-bottom:6px;
}
.shuffle-card .sc-foot{
  display:flex;align-items:center;gap:8px;font-size:0.7rem;color:var(--muted);
}
.shuffle-loadmore{text-align:center;padding:24px 0}
.shuffle-loadmore button{
  font-family:var(--font-body);font-size:0.84rem;font-weight:500;padding:8px 28px;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--card);
  color:var(--ink-soft);cursor:pointer;
}
.shuffle-loadmore button:hover{border-color:var(--gold)}

/* On This Day selects */
.otd-selects{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.otd-selects select{
  font-family:var(--font-body);font-size:0.875rem;padding:6px 10px;
  border:1px solid var(--border);border-radius:var(--r-xs);background:var(--canvas);
  color:var(--ink);outline:none;cursor:pointer;
}
.otd-selects select:focus{border-color:var(--gold)}

/* Sync page */
.sync-card{background:var(--card);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--sh-card);margin-bottom:14px}
.sync-card h3{font-family:var(--font-sans);font-size:0.95rem;font-weight:600;color:var(--ink);margin-bottom:14px}
.sync-card label{display:block;font-size:0.84rem;color:var(--ink-soft);margin-bottom:6px}
.sync-status-row{display:flex;gap:20px;flex-wrap:wrap;font-size:0.85rem;color:var(--muted);margin-bottom:16px}
.sync-status-row strong{color:var(--ink-soft)}
.sync-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-sync{
  font-family:var(--font-body);font-size:0.9rem;font-weight:500;padding:11px 32px;
  border-radius:var(--r-sm);border:none;cursor:pointer;display:inline-flex;
  align-items:center;gap:8px;
}
.btn-sync.start{background:var(--gold);color:#fff}
.btn-sync.start:hover{background:var(--gold-dk)}
.btn-sync.cancel{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-sync:disabled{background:var(--hairl);color:var(--muted);cursor:default}
.sync-error-card{background:var(--card);border-radius:var(--r-lg);padding:16px 22px;box-shadow:var(--sh-card);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sync-table{width:100%;font-size:0.84rem;border-collapse:collapse}
.sync-table th{padding:8px 12px;text-align:left;color:var(--muted);font-weight:500;border-bottom:1px solid var(--hairl)}
.sync-table td{padding:8px 12px;color:var(--ink-soft);border-bottom:1px solid var(--hairl)}
.sync-table td.num{text-align:right}
.sync-table td.new{text-align:right;color:var(--green);font-weight:600}
.sync-table td.ctr{text-align:center}
.status-badge{font-size:0.75rem;padding:2px 8px;border-radius:99px;font-weight:500}
.status-ok{color:var(--green);background:#eef5ef}
.status-fail{color:var(--red);background:#fdf0ee}

/* Account card */
.acct-card{
  background:var(--card);border-radius:var(--r-md);padding:16px 18px;
  box-shadow:var(--sh-card);margin-bottom:12px;
  display:flex;align-items:center;gap:14px;
}
.acct-avatar{
  width:48px;height:48px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:1.2rem;font-weight:600;font-family:var(--font-sans);
}
.acct-body{flex:1;min-width:0}
.acct-name{font-size:0.95rem;font-weight:600;color:var(--ink)}
.acct-sub{font-size:0.78rem;color:var(--muted)}
.acct-sub2{font-size:0.75rem;color:var(--faint);margin-top:2px}
.acct-actions{display:flex;gap:6px;flex-shrink:0}

/* Buttons */
.btn-sm{
  font-family:var(--font-body);font-size:0.76rem;font-weight:500;
  padding:5px 14px;border-radius:var(--r-xs);
  border:1px solid var(--border);background:var(--card);
  color:var(--ink-soft);cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;transition:all 150ms;
}
.btn-sm:hover{border-color:var(--gold);color:var(--gold-dk)}
.btn-sm.danger{color:var(--red);border-color:var(--red)}
.btn-sm.danger:hover{background:var(--red);color:#fff}
.btn-primary{
  font-family:var(--font-body);font-size:0.84rem;font-weight:500;
  padding:8px 20px;border-radius:var(--r-sm);border:none;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;

// ============================================================
// SHARED HELPERS
// ============================================================
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(ts){
  try{ const d=new Date(ts); if(isNaN(d.getTime()))return ts.slice(0,10); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  catch(e){return ts.slice(0,10);}
}
function fmtShort(ts){ try{ const d=new Date(ts); if(isNaN(d.getTime()))return ts.slice(0,10); const hh=String(d.getHours()).padStart(2,'0'); const mm=String(d.getMinutes()).padStart(2,'0'); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${hh}:${mm}`; }catch(e){return ts.slice(0,10);} }
function getAcct(uid){ return acctMap[uid]; }

function avatarHTML(uid, size){
  const a = getAcct(uid); if(!a) return '';
  const px = size||30;
  return `<span style="width:${px}px;height:${px}px;border-radius:50%;flex-shrink:0;background:${a.avatar_color};display:inline-flex"></span>`;
}

function postCardHTML(p, animate, delay){
  const acct = getAcct(p.uid); if(!acct) return '';
  const animStyle = animate ? `animation:fadeUp 0.4s var(--ease-out) both;animation-delay:${(delay||0)*0.04}s` : '';
  const isRepost = !p.is_original;
  const repostData = p.repost_json ? (typeof p.repost_json==='string' ? JSON.parse(p.repost_json) : p.repost_json) : null;

  let badges = '';
  if(p.is_original){
    badges += `<span class="badge badge-original">${ICONS.pen}原创</span>`;
  } else {
    badges += `<span class="badge badge-repost">${ICONS.repost}转发</span>`;
  }
  if(p.is_long_text) badges += `<span class="badge badge-long">${ICONS.fileText}长文</span>`;

  let repostHTML = '';
  if(isRepost && repostData){
    const ruser = (repostData.user&&repostData.user.screen_name) ? repostData.user.screen_name : '用户';
    const rtext = repostData.text_raw || repostData.text || '';
    const postKey = p.uid+'-'+p.weibo_id||'';
    repostHTML = `
      <div class="post-repost-embed" onclick="event.stopPropagation();toggleRepost('${esc(postKey)}')" data-postkey="${esc(postKey)}">
        <div class="rlabel">${ICONS.repost14}转发了 <strong>@${esc(ruser)}</strong> 的微博</div>
        <div class="rtext">${esc(rtext)}</div>
        <div class="rtoggle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>展开原文</div>
      </div>`;
  }

  return `
    <article class="post-card" style="${animStyle}" onclick="openPostDetail('${esc(p.uid)}','${esc(p.date)}','${esc(p.time)}','${esc(p.content)}',${p.is_original},${p.is_long_text},'${esc(JSON.stringify(repostData||{}))}','${esc(JSON.stringify(p.comments_data||[]))}',${p.reposts},${p.comments},${p.likes},'${esc(p.source||'')}')">
      <div class="post-hd">
        ${avatarHTML(p.uid,30)}
        <div class="post-meta">
          <div class="post-name">${acct.nickname}</div>
          <div class="post-time">${fmtDate(p.date+'T'+p.time+':00')}</div>
        </div>
        <div class="post-badges">${badges}</div>
      </div>
      <div class="post-content">${esc(p.content)}</div>
      ${repostHTML}
      <div class="post-footer">
        <span class="post-source">${ICONS.smartphone}来自 ${esc(p.source||'未知客户端')}</span>
        <span class="post-stat">${ICONS.repost14} ${p.reposts||0}</span>
        <span class="post-stat">${ICONS.msg14} ${p.comments||0}</span>
        <span class="post-stat">${ICONS.heart14} ${p.likes||0}</span>
      </div>
    </article>`;
}

// Repost toggle
function toggleRepost(postKey){
  const el = document.querySelector(`[data-postkey="${postKey}"]`);
  if(!el) return;
  const text = el.querySelector('.rtext');
  const toggle = el.querySelector('.rtoggle');
  if(!text||!toggle) return;
  if(text.classList.contains('expanded')){
    text.classList.remove('expanded');
    toggle.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>展开原文';
  } else {
    text.classList.add('expanded');
    toggle.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>收起原文';
  }
}

// ============================================================
// MODAL
// ============================================================
function openPostDetail(uid,date,time,content,is_original,is_long_text,repostJSON,commentsJSON,reposts,comments,likes,source){
  const acct = getAcct(uid); if(!acct) return;
  let repostData, commentsData;
  try{ repostData = JSON.parse(repostJSON); }catch(e){ repostData=null; }
  try{ commentsData = JSON.parse(commentsJSON); }catch(e){ commentsData=[]; }

  let repostHTML = '';
  if(!is_original && repostData){
    const ruser = (repostData.user&&repostData.user.screen_name) ? repostData.user.screen_name : '用户';
    const rtext = repostData.text_raw || repostData.text || '';
    repostHTML = `<div style="background:var(--hairl);border-radius:var(--r-sm);padding:14px 18px;margin-bottom:12px;border-left:3px solid var(--border)"><div style="font-size:0.84rem;color:var(--muted);margin-bottom:6px">转发了 <strong style="color:var(--ink-soft);font-weight:600">@${esc(ruser)}</strong></div><div style="font-size:0.88rem;color:var(--ink-soft);line-height:1.65">${esc(rtext)}</div></div>`;
  }

  let commentsHTML = '';
  if(commentsData && commentsData.length){
    commentsHTML = `<div class="modal-comments"><h4>评论 (${commentsData.length})</h4>`;
    commentsData.forEach(c=>{
      commentsHTML += `<div class="comment-item"><div class="comment-hd"><span class="comment-name">${esc(c.author)}</span><span class="comment-time">${esc(c.time)}</span></div><div class="comment-text">${esc(c.text)}</div></div>`;
    });
    commentsHTML += '</div>';
  }

  document.getElementById('modal-card').innerHTML = `
    <div class="modal-top"><span>${fmtDate(date+'T'+time+':00')}</span><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-content-text">${esc(content)}</div>
    ${repostHTML}
    <div class="post-footer" style="margin-top:14px">

function createCustomSelect(containerId, options, defaultVal, onChange){
  const container = document.getElementById(containerId);
  if(!container) return;
  let open = false, value = defaultVal||'';

  function render(){
    const sel = options.find(o=>o.value===value);
    container.innerHTML = `
      <button class="cusel-btn"><span>${sel?sel.label:(value||'全部账号')}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted);transition:transform 200ms;${open?'transform:rotate(180deg)':''}"><path d="m6 9 6 6 6-6"/></svg></button>
      ${open ? `<div class="cusel-dropdown">${options.map(o=>`<button class="cusel-opt${o.value===value?' sel':''}">${o.label}</button>`).join('')}</div>` : ''}
    `;
    container.querySelector('.cusel-btn').onclick = ()=>{ open=!open; render(); };
    container.querySelectorAll('.cusel-opt').forEach((btn,i)=>{
      btn.onclick = ()=>{ value=options[i].value; open=false; render(); if(onChange) onChange(value); };
    });
  }

  document.addEventListener('mousedown', function handler(e){
    if(!container.contains(e.target) && open){ open=false; render(); }
  });

  render();
  return { getValue: ()=>value, setValue: (v)=>{ value=v; render(); } };
}

// ============================================================
// DATEPICKER COMPONENT
// ============================================================
function createDatePicker(containerId, placeholder, onChange){
  const container = document.getElementById(containerId);
  if(!container) return;
  let open = false, value = '';
  const today = new Date();
  let viewYear = today.getFullYear(), viewMonth = today.getMonth();
  const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const WDAYS = ['一','二','三','四','五','六','日'];
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
  function firstDow(y,m){ const d=new Date(y,m,1).getDay(); return d===0?6:d-1; }
  function fmt(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

  function render(){
    const total = daysInMonth(viewYear, viewMonth);
    const start = firstDow(viewYear, viewMonth);
    let days = [];
    for(let i=0;i<start;i++) days.push(null);
    for(let d=1;d<=total;d++) days.push(d);
    while(days.length%7!==0) days.push(null);

    container.innerHTML = `
      <button class="dp-trigger" id="${containerId}-trig"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>${value||placeholder||'选择日期'}</span>${value?`<span style="margin-left:auto;color:var(--muted);cursor:pointer;font-size:1rem" id="${containerId}-clear">&times;</span>`:''}</button>
      ${open ? `
      <div class="dp-drop">
        <div class="dp-nav">
          <button id="${containerId}-prev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
          <div style="display:flex;align-items:center;gap:6px">
            <select id="${containerId}-year">${Array.from({length:20},(_,i)=>today.getFullYear()-15+i).map(y=>`<option value="${y}"${y===viewYear?' selected':''}>${y}</option>`).join('')}</select>
            <select id="${containerId}-month">${MONTHS.map((l,i)=>`<option value="${i}"${i===viewMonth?' selected':''}>${l}</option>`).join('')}</select>
          </div>
          <button id="${containerId}-next"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <div class="dp-grid">${WDAYS.map(w=>`<div class="dp-day-hd">${w}</div>`).join('')}${days.map((d,i)=>{if(d===null)return'<div class="dp-day empty"></div>';const ds=fmt(viewYear,viewMonth,d);const isToday=ds===todayStr,isSel=ds===value;return`<button class="dp-day${isToday?' today':''}${isSel?' sel':''}" data-date="${ds}">${d}</button>`;}).join('')}</div>
        <div class="dp-actions"><button class="dp-btn-clear" id="${containerId}-dpclr">清除</button><button class="dp-btn-today" id="${containerId}-dptdy">今天</button></div>
      </div>`:''}
    `;

    // Bind events
    const trig = document.getElementById(containerId+'-trig');
    if(trig) trig.onclick = ()=>{ open=!open; render(); };

    const clr = document.getElementById(containerId+'-clear');
    if(clr) clr.onclick = (e)=>{ e.stopPropagation(); value=''; open=false; render(); if(onChange) onChange(''); };

    if(open){
      document.getElementById(containerId+'-prev').onclick = ()=>{ if(viewMonth===0){viewYear--;viewMonth=11}else viewMonth--; render(); };
      document.getElementById(containerId+'-next').onclick = ()=>{ if(viewMonth===11){viewYear++;viewMonth=0}else viewMonth++; render(); };
      document.getElementById(containerId+'-year').onchange = function(){ viewYear=parseInt(this.value); render(); };
      document.getElementById(containerId+'-month').onchange = function(){ viewMonth=parseInt(this.value); render(); };
      document.getElementById(containerId+'-dpclr').onclick = ()=>{ value=''; open=false; render(); if(onChange) onChange(''); };
      document.getElementById(containerId+'-dptdy').onclick = ()=>{ value=todayStr; open=false; render(); if(onChange) onChange(value); };
      container.querySelectorAll('.dp-day:not(.empty)').forEach(btn=>{
        btn.onclick = ()=>{ value=btn.dataset.date; open=false; render(); if(onChange) onChange(value); };
      });
    }

    document.addEventListener('mousedown', function handler(e){
      if(!container.contains(e.target) && open){ open=false; render(); }
    });
  }

  render();
  return { getValue: ()=>value, setValue: (v)=>{ value=v; render(); } };
}

let browsePage = 1, browsePerPage = 15;
let browseFilter = { acct:'', type:'all', dateFrom:'', dateTo:'', keyword:'' };
let browseSel;

function initBrowse(){
  const acctOpts = [{value:'',label:'全部账号'},...ACCOUNTS.map(a=>({value:a.uid,label:a.nickname}))];
  browseSel = createCustomSelect('browse-acct-wrap', acctOpts, '', (v)=>{ browseFilter.acct=v; browsePage=1; renderBrowse(); });

  const seg = document.getElementById('browse-type-ctrl');

    <button class="seg-btn active" data-v="all"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>全部</button>

  seg.querySelectorAll('.seg-btn').forEach(btn=>{

      seg.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      browseFilter.type = btn.dataset.v;
      browsePage = 1;
      renderBrowse();
    });
  });

  // DatePickers
  createDatePicker('browse-dp-from', '开始日期', (v)=>{ browseFilter.dateFrom=v; browsePage=1; renderBrowse(); });
  createDatePicker('browse-dp-to', '结束日期', (v)=>{ browseFilter.dateTo=v; browsePage=1; renderBrowse(); });

  // Search
  const searchEl = document.getElementById('browse-search');
  let searchTimer;
  searchEl.addEventListener('input',()=>{
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{ browseFilter.keyword=searchEl.value; browsePage=1; renderBrowse(); },300);
  });

}

function getFilteredPosts(){
  let arr = POSTS;
  if(browseFilter.acct) arr = arr.filter(p=>p.uid===browseFilter.acct);
  if(browseFilter.dateFrom) arr = arr.filter(p=>p.date>=browseFilter.dateFrom);
  if(browseFilter.dateTo) arr = arr.filter(p=>p.date<=browseFilter.dateTo);
  if(browseFilter.keyword) arr = arr.filter(p=>p.content.toLowerCase().includes(browseFilter.keyword.toLowerCase()));
  if(browseFilter.type==='original') arr = arr.filter(p=>p.is_original);
  if(browseFilter.type==='repost') arr = arr.filter(p=>!p.is_original);
  return arr;
}

function renderBrowse(){
  const filtered = getFilteredPosts();
  const totalPages = Math.ceil(filtered.length / browsePerPage);
  if(browsePage > totalPages) browsePage = Math.max(1, totalPages);
  const start = (browsePage-1)*browsePerPage;
  const pagePosts = filtered.slice(start, start+browsePerPage);

  // Stats
  const uids = new Set(filtered.map(p=>p.uid));
  let earliest = '', latest = '';
  if(filtered.length){ earliest = filtered[filtered.length-1].date; latest = filtered[0].date; }
  document.getElementById('browse-stats').innerHTML = `
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <span>共 <strong>${filtered.length}</strong> 条微博</span>
      <span>来自 <strong>${uids.size}</strong> 个账号</span>
      ${filtered.length?`<span><strong>${earliest.slice(0,7)}</strong> — <strong>${latest.slice(0,7)}</strong></span>`:''}
    </div>
    <div class="export-wrap" id="browse-export-wrap"></div>`;

  // Export
  initExportBtn('browse-export-wrap');

  // Posts
  const list = document.getElementById('browse-list');
  const empty = document.getElementById('browse-empty');
  if(filtered.length===0){
    list.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('browse-pager-top').style.display = 'none';
    document.getElementById('browse-pager-bottom').style.display = 'none';
    return;
  }
  empty.style.display = 'none';

  // Group by year
  let lastYear = '', html = '';
  pagePosts.forEach((p,i)=>{
    const y = p.date.slice(0,4);
    if(y !== lastYear){
      html += `<div class="year-div"><span>${y}</span></div>`;
      lastYear = y;
    }
    html += postCardHTML(p, true, i);
  });
  list.innerHTML = html;

  // Pagination
  renderPagination('browse-pager-top', browsePage, totalPages);
  renderPagination('browse-pager-bottom', browsePage, totalPages);
  if(totalPages > 1){
    document.getElementById('browse-pager-top').style.display = 'flex';
    document.getElementById('browse-pager-bottom').style.display = 'flex';
  } else {
    document.getElementById('browse-pager-top').style.display = 'none';
    document.getElementById('browse-pager-bottom').style.display = 'none';
  }
}

function renderPagination(containerId, page, totalPages){
  const container = document.getElementById(containerId);
  if(!container) return;
  let html = '';
  html += `<button class="pager-btn" ${page<=1?'disabled':''} onclick="browsePage=${page-1};renderBrowse()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>`;

  const pages = [];
  if(totalPages<=7){
    for(let i=1;i<=totalPages;i++) pages.push(i);
  } else {
    pages.push(1);
    if(page>3) pages.push('...');
    for(let i=Math.max(2,page-1);i<=Math.min(totalPages-1,page+1);i++) pages.push(i);
    if(page<totalPages-2) pages.push('...');
    pages.push(totalPages);
  }
  pages.forEach(p=>{
    if(p==='...') html += '<span class="pager-dots">...</span>';
    else if(p===page) html += `<button class="pager-btn active">${p}</button>`;
    else html += `<button class="pager-btn" onclick="browsePage=${p};renderBrowse()">${p}</button>`;
  });

  html += `<button class="pager-btn" ${page>=totalPages?'disabled':''} onclick="browsePage=${page+1};renderBrowse()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>`;

  if(totalPages>5){
    html += `<span class="pager-jump"><input type="number" min="1" max="${totalPages}" value="${page}" id="${containerId}-jump" onkeydown="if(event.key==='Enter'){const v=parseInt(this.value);if(v>=1&&v<=${totalPages}){browsePage=v;renderBrowse();}}"><button class="pager-btn" onclick="const v=parseInt(document.getElementById('${containerId}-jump').value);if(v>=1&&v<=${totalPages}){browsePage=v;renderBrowse();}">跳转</button></span>`;
  }
  container.innerHTML = html;
}

function initExportBtn(wrapId){
  const wrap = document.getElementById(wrapId);
  if(!wrap) return;

  function render(){
    wrap.innerHTML = `
      <button class="export-btn" id="${wrapId}-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出</button>

function getShufflePool(){

let todayMonth, todayDay;

function initToday(){
  const monSel = document.getElementById('today-month');

  const daySel = document.getElementById('today-day');
  for(let i=1;i<=31;i++){ const o=document.createElement('option'); o.value=i; o.textContent=i+'日'; daySel.appendChild(o); }

  const now = new Date();
  monSel.value = now.getMonth()+1;
  daySel.value = now.getDate();
  todayMonth = now.getMonth()+1;
  todayDay = now.getDate();

  monSel.addEventListener('change',()=>{ todayMonth=parseInt(monSel.value); fetchToday(); });
  daySel.addEventListener('change',()=>{ todayDay=parseInt(daySel.value); fetchToday(); });

  fetchToday();
}

function fetchToday(){
  const mm = String(todayMonth).padStart(2,'0'), dd = String(todayDay).padStart(2,'0');
  const target = mm+'-'+dd;
  const posts = POSTS.filter(p=>p.date.slice(5,10)===target);

  document.getElementById('today-stats').style.display = posts.length?'flex':'none';
  document.getElementById('today-list').innerHTML = '';
  document.getElementById('today-empty').style.display = posts.length?'none':'block';
  document.getElementById('today-empty-msg').textContent = `${todayMonth}月${todayDay}日还没有微博记录`;

  if(posts.length){
    const uids = new Set(posts.map(p=>p.uid));
    const years = [...new Set(posts.map(p=>p.date.slice(0,4)))];
    document.getElementById('today-stats').innerHTML = `
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <span>共 <strong>${posts.length}</strong> 条微博</span>
        <span>来自 <strong>${uids.size}</strong> 个账号</span>
        <span><strong>${years.length}</strong> 个年份</span>
      </div>`;

    // Group by year
    let lastYear = '', html = '';
    posts.forEach((p,i)=>{
      const y = p.date.slice(0,4);
      if(y !== lastYear){
        html += `<div class="year-div"><span>${y}</span></div>`;
        lastYear = y;
      }
      html += postCardHTML(p, true, i);
    });
    document.getElementById('today-list').innerHTML = html;
  }
}

      <thead><tr><th>开始时间</th><th style="text-align:right">抓取数</th><th style="text-align:right">新增</th><th style="text-align:center">状态</th></tr></thead>
      <tbody>
        <tr><td>${new Date(acct.last_sync).toLocaleString('zh-CN')}</td><td class="num">${acct.posts}</td><td class="new">+${Math.floor(acct.posts*0.05)}</td><td class="ctr"><span class="status-badge status-ok">完成</span></td></tr>
        <tr><td>${new Date(Date.parse(acct.last_sync)-86400000*7).toLocaleString('zh-CN')}</td><td class="num">${Math.floor(acct.posts*0.92)}</td><td class="new">+${Math.floor(acct.posts*0.08)}</td><td class="ctr"><span class="status-badge status-ok">完成</span></td></tr>
        <tr><td>${new Date(Date.parse(acct.last_sync)-86400000*14).toLocaleString('zh-CN')}</td><td class="num">${Math.floor(acct.posts*0.8)}</td><td class="new">+${Math.floor(acct.posts*0.15)}</td><td class="ctr"><span class="status-badge status-ok">完成</span></td></tr>
      </tbody>
    </table>`;
}

function startSync(){
  if(syncing) return;
  syncing = true;
  const acct = getAcct(syncAcctUid);
  const startBtn = document.getElementById('sync-start-btn');
  const cancelBtn = document.getElementById('sync-cancel-btn');
  const errorDiv = document.getElementById('sync-error');

  errorDiv.style.display = 'none';
  cancelBtn.style.display = 'inline-flex';
  startBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>同步中 · 帖子...`;
  startBtn.disabled = true;

  // Simulate 3-stage sync
  syncTimer = setTimeout(()=>{ startBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>同步中 · 评论...`; }, 2000);
  syncTimer = setTimeout(()=>{ startBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>同步中 · 图片...`; }, 3500);
  syncTimer = setTimeout(()=>{ finishSync(); }, 5000);
}

function cancelSync(){
  if(syncTimer) clearTimeout(syncTimer);
  syncing = false;
  document.getElementById('sync-start-btn').innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>一键同步`;
  document.getElementById('sync-start-btn').disabled = false;
  document.getElementById('sync-cancel-btn').style.display = 'none';
}

function finishSync(){
  syncing = false;
  document.getElementById('sync-start-btn').innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>一键同步`;
  document.getElementById('sync-start-btn').disabled = false;
  document.getElementById('sync-cancel-btn').style.display = 'none';

  // Update history
  const acct = getAcct(syncAcctUid);
  document.getElementById('sync-history-content').innerHTML = getSyncHistoryHTML(acct);
  updateSyncDisplay();
}

function renderAccounts(){
  document.getElementById('acct-list').innerHTML = ACCOUNTS.map(a=>`
    <div class="acct-card">
      <span class="acct-avatar" style="background:${a.avatar_color}"></span>
      <div class="acct-body">
        <div class="acct-name">${a.nickname}</div>
        <div class="acct-sub">UID: ${a.uid}</div>
        <div class="acct-sub2">上次同步: ${new Date(a.last_sync).toLocaleString('zh-CN')}</div>
      </div>
      <div class="acct-actions">
        <button class="btn-sm" onclick="alert('刷新功能 Demo')">刷新</button>
        <button class="btn-sm" onclick="alert('编辑功能 Demo')">编辑</button>
        <button class="btn-sm danger" onclick="alert('删除功能 Demo')">删除</button>
      </div>
    </div>
  `).join('');

  document.getElementById('acct-add-btn').addEventListener('click', ()=>{ alert('添加账号 Demo —— 实际需输入 UID 和 Cookie'); });
}

// ============================================================
// TAB SWITCHING
// ============================================================
document.querySelectorAll('.nav-pill').forEach(btn=>{
  btn.addEventListener('click', function(){
    document.querySelectorAll('.nav-pill').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    const tab = this.dataset.tab;
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+tab).classList.add('active');
    if(tab==='shuffle') doShuffle();
  });
});

// ============================================================
// INIT
// ============================================================
initBrowse();
initShuffle();
initToday();
initSync();
renderAccounts();

// Init sync history display
const syncHistAcct = getAcct(syncAcctUid);
if(syncHistAcct) document.getElementById('sync-history-content').innerHTML = getSyncHistoryHTML(syncHistAcct);
</script>
